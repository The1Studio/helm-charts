planeVersion: v1.2.0

dockerRegistry:
  enabled: false
  host: "index.docker.io/v1/"
  loginid: ""
  password: ""

ingress:
  enabled: true
  appHost: "plane.example.com"
  # WARNING: setting minioHost or rabbitmqHost exposes the MinIO console (:9090)
  # and RabbitMQ management UI (:15672) on the public ingress. Only set these
  # behind TLS and strong credentials — never expose them on an untrusted network.
  minioHost: ""
  rabbitmqHost: ""
  # Set to "traefik" (or any value starting with "traefik") to deploy native Traefik IngressRoute CRDs
  # (templates/ingress-traefik.yaml). Set to any other value (e.g., "nginx") to deploy a standard
  # networking.k8s.io/v1 Ingress resource (templates/ingress.yaml).
  ingressClass: "traefik"
  # Traefik-specific options (only used when ingressClass starts with "traefik")
  traefik:
    maxRequestBodyBytes: 20971520   # in bytes (default: 20 MiB)
  # ingress_annotations: { "nginx.ingress.kubernetes.io/proxy-body-size": "5m" }

# SSL Configuration - Valid only if ingress.enabled is true
ssl:
  tls_secret_name: "" # If you have a custom TLS secret name
  # If you want to use Let's Encrypt, set createIssuer and generateCerts to true
  createIssuer: false
  issuer: "http" # Allowed : cloudflare, digitalocean, http
  token: "" # not required for http
  server: https://acme-v02.api.letsencrypt.org/directory
  email: plane@example.com
  generateCerts: false

redis:
  local_setup: true
  image: valkey/valkey:7.2.11-alpine
  servicePort: 6379
  storageClass: ""
  volumeSize: 100Mi
  pullPolicy: IfNotPresent
  assign_cluster_ip: false
  labels: {}
  annotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

postgres:
  local_setup: true
  image: postgres:15.7-alpine
  servicePort: 5432
  storageClass: ""
  volumeSize: 1Gi
  pullPolicy: IfNotPresent
  assign_cluster_ip: false
  labels: {}
  annotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

rabbitmq:
  local_setup: true
  image: rabbitmq:3.13.6-management-alpine
  pullPolicy: IfNotPresent
  servicePort: 5672
  managementPort: 15672
  storageClass: ""
  volumeSize: 100Mi
  default_user: plane
  # REQUIRED when local_setup=true — no default. Set a strong password here or
  # supply it via external_secrets.rabbitmq_existingSecret.
  default_password: ''
  external_rabbitmq_url: ''
  assign_cluster_ip: false
  labels: {}
  annotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

minio:
  image: minio/minio:latest
  image_mc: minio/mc:latest
  local_setup: true
  pullPolicy: IfNotPresent
  # REQUIRED when local_setup=true — no default. Set a strong password here or
  # supply it via external_secrets.doc_store_existingSecret.
  root_password: ''
  root_user: admin
  storageClass: ""
  volumeSize: 1Gi
  assign_cluster_ip: false
  labels: {}
  annotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  env:
    minio_endpoint_ssl: false

web:
  replicas: 1
  memoryLimit: 1000Mi
  cpuLimit: 500m
  cpuRequest: 50m
  memoryRequest: 50Mi
  image: artifacts.plane.so/makeplane/plane-frontend
  pullPolicy: Always
  assign_cluster_ip: false
  labels: {}
  annotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

